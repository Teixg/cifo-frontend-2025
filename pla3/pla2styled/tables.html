<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="
    styles.css"
    />
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

      
    
    <title>Tables</title>
  </head>
  <body>
    <h1>TAULES</h1>

    <!-- Taula amb informació de debats -->
    <table>
      <caption id="tTitle">
        <span class="fa-solid fa-comments"></span>Fòrum del curs
      </caption>
      <thead>
        <tr id="tableHead">
          <!-- Encapçalaments de columna -->
          <th scope="col">Debat</th>
          <th scope="col">Iniciat per</th>
          <th scope="col">Darrer Missatge<i class="fa-solid fa-arrow-down"></i></th>
          <th scope="col">Rèpliques</th>
        </tr>
      </thead>
      <tbody>
        <!-- Fila de dades amb imatges i informació dels debats -->
        <tr>
          <th scope="row">
            <span class="fa fa-star checked"></span> Presentació 1
          </th>
          <td><i class="fa-solid fa-circle-user"></i>Usuari 0</td>
          <td><i class="fa-solid fa-circle-user"></i>Professor 3</td>
          <td class="mess">4</td>
        </tr>
        <tr>
          <th scope="row">
            <span class="fa fa-star checked"></span> Presentació 2
          </th>
          <td><i class="fa-solid fa-circle-user"></i>Usuari 1</td>
          <td><i class="fa-solid fa-circle-user"></i>Professor 2</td>
          <td class="mess">8</td>
        </tr>
        <tr>
          <th scope="row"><span class="fa fa-star"></span> Presentació 3</th>
          <td><i class="fa-solid fa-circle-user"></i>Usuari 2</td>
          <td><i class="fa-solid fa-circle-user"></i>Professor 2</td>
          <td class="mess">2</td>
        </tr>
        <tr>
          <th scope="row">
            <span class="fa fa-star checked"></span> Presentació 4
          </th>
          <td><i class="fa-solid fa-circle-user"></i>Usuari 3</td>
          <td><i class="fa-solid fa-circle-user"></i>Professor 4</td>
          <td class="mess">5</td>
        </tr>
        <tr>
          <th scope="row"><span class="fa fa-star"></span> Presentació 4</th>
          <td><i class="fa-solid fa-circle-user"></i>Usuari 4</td>
          <td><i class="fa-solid fa-circle-user"></i>Professor 1</td>
          <td class="mess">3</td>
        </tr>
      </tbody>
    </table>

  </body>
</html>
