<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Teix Garcia" />

    <title>Pla2-Multimedia</title>
  </head>
  <body>
    <h1>MULTIMEDIA</h1>

    <!-- Secció d'àudio amb fitxer local -->
    <h2>Audio local</h2>
    <audio src="./media/audio.wav" controls type="audio/wav"></audio>

    <hr />

    <!-- Secció de vídeo amb fitxer local -->
    <h2>Video local</h2>
    <video
      src="./media/video.mp4"
      controls
      preload="auto"
      width="400"
      height="300"
    ></video>

    <hr />

    <!-- Secció amb un iframe que mostra un mapa de OpenStreetMap -->
    <h2>iframe</h2>
    <iframe
      width="425"
      height="350"
      src="https://www.openstreetmap.org/export/embed.html?bbox=0.5676412582397462%2C40.70102438126112%2C0.5950212478637696%2C40.715191908398225&amp;layer=mapnik"
    ></iframe>

    <!-- Enllaç de retorn a l’índex -->
    <p><a href="./index.html">Tornar a l'índex</a></p>
  </body>
</html>
