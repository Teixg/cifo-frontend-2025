<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Playlitics</title>
		<link
			rel="icon"
			href="./assets/favicon.ico"
			type="image/x-icon"
			sizes="16x16"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
		/>
		<link rel="stylesheet" href="./styles/styles.css" />
		<link rel="stylesheet" href="./styles/gallery.css" />
		<link rel="icon" href="" type="image/x-icon" />
		<script src="./modules/gallery.js" type="module"></script>
	</head>
	<body>
		<header>
			<div class="logo-container"><img class="logo" src="./assets/logo.png" alt="Playlitics Logo" />
			<h1>Playlitics</h1></div>
			<div id="userInfo"></div>
		</header>
		<div class="d-flex align-items-center mb-3">
  <label for="sortType" class="me-2">Sort by:</label>
  <select id="sortType" class="form-select w-auto">
    <option value="alpha" selected>Alphabetical (A-Z)</option>
    <option value="time">Most Time Played</option>
  </select>
</div>
		<div id="gallery"><div id="loader" class="d-flex justify-content-center my-4" style="display:none;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div></div>
		<div class="d-flex align-items-center mb-3">
  <label for="pageSize" class="me-2">Games per page:</label>
  <select id="pageSize" class="form-select w-auto">
    <option value="5">5</option>
    <option value="10" selected>10</option>
    <option value="15">15</option>
    <option value="20">20</option>
	<option value="25">25</option>
	<option value="30">30</option>
	<option value="35">35</option>
	<option value="40">40</option>
  </select>
</div>
 <div id="pagination-controls"> 
		</div><footer>
			<p>
				Playlitics is a platform that provides insights and analytics for
				gamers.
			</p>
			<p>Developed by Teix</p>
			<p>&copy; 2025 PLaylitics. All rights reserved.</p>
		</footer>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
			crossorigin="anonymous"
		></script>
	</body>
</html>

<template>
	<div class="card game-card">
		<img src="" class="card-img-top game-img" alt="Game Image" />
		<div class="card-body">
			<h5 class="card-title game-title"></h5>
			<p class="card-text game-appid"></p>	
</template>
