<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Playlitics</title>
		<!-- =========================
             Favicon & Stylesheets
             ========================= -->
		<link
			rel="icon"
			href="./assets/favicon.ico"
			type="image/x-icon"
			sizes="16x16"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
			rel="stylesheet"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
		/>
		<link rel="stylesheet" href="./styles/styles.css" />
		<link rel="stylesheet" href="./styles/gallery.css" />
		<script src="./modules/gallery.js" type="module"></script>
	</head>
	<body>
		<!-- =========================
             Header & User Info
             ========================= -->
		<header>
			<a href="./index.html">
				<div class="logo-container">
					<img class="logo" src="./assets/logo.png" alt="Playlitics Logo" />
					<h1>Playlitics</h1>
				</div>
			</a>
			<div id="userInfo"></div>
		</header>

		<!-- =========================
             Controls (Sort & Page Size)
             ========================= -->
		<div class="controls">
			<div class="d-flex align-items-center mb-3">
				<label for="sortType" class="me-2">Sort by:</label>
				<select id="sortType" class="form-select w-auto">
					<option value="alpha" selected>Alphabetical (A-Z)</option>
					<option value="time">Most Time Played</option>
				</select>
			</div>
			<div class="d-flex align-items-center mb-3">
				<label for="pageSize" class="me-2">Games per page:</label>
				<select id="pageSize" class="form-select w-auto">
					<option value="5">5</option>
					<option value="10" selected>10</option>
					<option value="15">15</option>
					<option value="20">20</option>
					<option value="25">25</option>
					<option value="30">30</option>
					<option value="35">35</option>
					<option value="40">40</option>
				</select>
			</div>
		</div>

		<!-- =========================
             Gallery & Loader
             ========================= -->
		<div id="gallery">
			<div
				id="loader"
				class="d-flex justify-content-center my-4"
				style="display: none"
			>
				<div class="spinner-border text-primary" role="status">
					<span class="visually-hidden">Loading...</span>
				</div>
			</div>
		</div>

		<!-- =========================
             Pagination Controls
             ========================= -->
		<div id="pagination-controls"></div>

		<!-- =========================
             Footer
             ========================= -->
		<footer>
			<p>
				Playlitics is a platform that provides insights and analytics for
				gamers.
			</p>
			<p>Developed by Teix</p>
			<p>&copy; 2025 Playlitics. All rights reserved.</p>
		</footer>

		<!-- =========================
             Bootstrap JS
             ========================= -->
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
			crossorigin="anonymous"
		></script>
	</body>
</html>

<!-- =========================
     Game Card Template
     ========================= -->
<template id="game-card-template">
	<a class="game-card-link">
		<div class="game-card">
			<img class="game-img" src="" alt="" />
			<p class="game-title"></p>
			<div class="stats">
				<p class="game-hours"></p>
				<p class="game-achievements"></p>
			</div>
		</div>
	</a>
</template>
